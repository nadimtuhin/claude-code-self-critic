name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Syntax check
        run: for f in src/*.mjs test/*.mjs; do node --check "$f"; done

      - name: Check shell scripts
        run: bash -n install.sh && bash -n deploy.sh

      - name: Run tests
        run: npm test
